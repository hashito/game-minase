<!doctype html>
<html lang="ja" data-theme="dark-industrial" data-dot="%MODE%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- every path is absolute from the site root: the dot pages share the root's data, voices, photos, textures and code (not copies) -->
<base href="/">
<!-- the hosting serves /dot (no trailing slash); the page names itself /dot/ so that what the kit reads beside the page (pixel-items.json) is this version's -->
<script>if (!location.pathname.endsWith('/')) history.replaceState(null, '', location.pathname + '/' + location.search + location.hash);</script>
<!--DOT-HEAD-->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- phones: added to the home screen it opens full screen and sideways (iOS has no fullscreen API for pages: js/kit/phone-play.js shows how) -->
<link rel="manifest" href="/dot/assets/icons/manifest-%MODE%.webmanifest">
<link rel="apple-touch-icon" href="/dot/assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" data-gf-fonts href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/css/kit.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/themes.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/theme-game.css">
<link rel="stylesheet" href="/dot/css/dot.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.min.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="boot" class="gf-boot" role="status" aria-live="polite"><div class="gf-boot-bar"></div><span>読み込み中…</span></div>
<div class="gf-scanlines"></div>
<script type="module">
// the same game (root js/ext, data, voices) with the dot layer (/dot/js/dot/index.js, listed in this page's game.json)
import { loadGame } from '/js/kit/game-core.js';
import * as pixel from '/dot/js/kit/pixel-style.js';
loadGame('%MANIFEST%', { mods: { pixel } }).catch((e) => {
  console.error(e);
  document.body.insertAdjacentHTML('beforeend', `<pre style="color:#f88;padding:1em">${e.message}</pre>`);
});
</script>
</body>
</html>
